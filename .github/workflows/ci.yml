name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest
      - run: pytest -q
      - name: self-demo (trifecta example must fail with exit 2)
        run: |
          python -m ltlint.cli examples/trifecta_agent.json && echo "ERROR: should have exited 2" && exit 1 || echo "correctly flagged"
